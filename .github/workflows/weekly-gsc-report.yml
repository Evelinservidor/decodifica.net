name: Weekly GSC Report

on:
  schedule:
    # Lunes 07:00 UTC = 09:00 Europe/Madrid (CEST). Cron usa UTC siempre.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days back to query'
        required: false
        default: '7'
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-gsc
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests

      - name: Run weekly GSC report
        env:
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAYS_BACK: ${{ inputs.days || '7' }}
        run: python scripts/weekly_gsc_report.py

      - name: Save report as artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-report
          path: gsc-report.txt
          if-no-files-found: ignore
