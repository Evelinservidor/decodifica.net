name: Weekly GSC Report

on:
  schedule:
    # Lunes 04:17 UTC (06:17 en Madrid en verano, 05:17 en invierno). Cron usa UTC.
    # A un minuto que no es en punto: a las horas en punto GitHub va saturado y el
    # 12-10-2026 el de las 07:00 corrió a las 16:29, después del agente de los lunes.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days back to query'
        required: false
        default: '7'
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: weekly-gsc
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Acceso a Search Console sin claves: GitHub pide un token temporal a Google
      # (federación de identidades; la organización bloquea crear claves).
      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/979898982695/locations/global/workloadIdentityPools/github/providers/decodifica
          service_account: informe-gsc@decodifica-informes-510822.iam.gserviceaccount.com

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests google-auth

      - name: Run weekly GSC report (7 días)
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_SITE_URLS: ${{ secrets.GSC_SITE_URLS }}
          DAYS_BACK: ${{ inputs.days || '7' }}
          OUTPUT_DIR: ${{ github.workspace }}/data/gsc_weekly
        run: python scripts/weekly_gsc_report.py

      # 28 y 90 días: con 7 días Google esconde la mayoría de las búsquedas.
      # Solo decodifica.net (los blogs de Blogspot no hacen falta aquí).
      - name: Informe de 28 días (latest_28d.json)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GSC_SITE_URLS: sc-domain:decodifica.net
          DAYS_BACK: '28'
          OUTPUT_SUFFIX: _28d
          OUTPUT_DIR: ${{ github.workspace }}/data/gsc_weekly
        run: python scripts/weekly_gsc_report.py

      - name: Informe de 90 días (latest_90d.json)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GSC_SITE_URLS: sc-domain:decodifica.net
          DAYS_BACK: '90'
          OUTPUT_SUFFIX: _90d
          OUTPUT_DIR: ${{ github.workspace }}/data/gsc_weekly
        run: python scripts/weekly_gsc_report.py

      # Qué páginas del sitemap tiene Google (latest_indexacion.json / .md).
      # Tarda unos 12 minutos (Google contesta cada página en ~6 s).
      - name: Páginas en Google (inspección de URLs)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data/gsc_weekly
        run: python scripts/gsc_indexacion.py

      - name: Commit outputs to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gsc_weekly/
          git diff --cached --quiet || git commit -m "data: weekly GSC report $(date -u +%Y-%m-%d)" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
