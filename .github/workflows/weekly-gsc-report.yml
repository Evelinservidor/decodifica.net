name: Weekly GSC Report

on:
  schedule:
    # Lunes 07:00 UTC = 09:00 Europe/Madrid (CEST). Cron usa UTC siempre.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days back to query'
        required: false
        default: '7'
        type: string

permissions:
  contents: write

concurrency:
  group: weekly-gsc
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests

      - name: Run weekly GSC report
        env:
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_SITE_URLS: ${{ secrets.GSC_SITE_URLS }}
          DAYS_BACK: ${{ inputs.days || '7' }}
          OUTPUT_DIR: ${{ github.workspace }}/data/gsc_weekly
        run: python scripts/weekly_gsc_report.py

      - name: Commit outputs to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gsc_weekly/
          git diff --cached --quiet || git commit -m "data: weekly GSC report $(date -u +%Y-%m-%d)" || true
          git push origin main
