<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth callback - Decodifica</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
      .container { text-align: center; padding: 2rem; max-width: 480px; }
      h1 { color: #06b6d4; margin-bottom: 1rem; }
      a { color: #06b6d4; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .error { color: #fca5a5; background: #450a0a; border: 1px solid #7f1d1d; border-radius: 8px; padding: 1rem; margin-top: 1rem; font-family: monospace; font-size: 0.85rem; text-align: left; white-space: pre-wrap; word-break: break-word; }
      .hidden { display: none !important; }
      .spinner { display: inline-block; width: 1.5rem; height: 1.5rem; border: 3px solid #1e293b; border-top-color: #06b6d4; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 id="title">Iniciando sesión…</h1>
      <div class="spinner" id="spinner"></div>
      <p id="status" style="margin-top: 1rem; color: #94a3b8;">Intercambiando código de autenticación con Supabase.</p>
      <div id="error-box" class="error hidden"></div>
      <p style="margin-top: 1.5rem;"><a href="/" id="home-link">Volver al inicio</a></p>
    </div>

    <script type="module">
      // Lesson 2026-06-11 (round 4): Stop fighting @supabase/ssr.
      // That lib is for SSR (Next.js, SvelteKit, Astro SSR). Our pages are
      // STATIC (Astro output: 'static'), and for client-only PKCE flows
      // Supabase recommends @supabase/supabase-js@2 with flowType: 'pkce' and
      // detectSessionInUrl: true. That's what we use here.
      // /login also needs to be migrated from @supabase/ssr to this same
      // client so both write and read the verifier under the same key.

      const titleEl = document.getElementById('title');
      const statusEl = document.getElementById('status');
      const errorBox = document.getElementById('error-box');
      const spinner = document.getElementById('spinner');

      function showError(message, detail) {
        spinner.classList.add('hidden');
        titleEl.textContent = 'Error de autenticación';
        statusEl.textContent = 'No se pudo completar el inicio de sesión.';
        errorBox.classList.remove('hidden');
        errorBox.textContent = message + (detail ? '\n\nDetalle:\n' + detail : '');
        console.error('[auth-callback] Error:', message, detail || '');
      }

      try {
        const url = new URL(window.location.href);
        const errorParam = url.searchParams.get('error');
        const errorDesc = url.searchParams.get('error_description');
        if (errorParam) {
          showError('Supabase rechazó el callback.', `${errorParam}${errorDesc ? ': ' + errorDesc : ''}`);
          throw new Error('oauth_error');
        }

        const code = url.searchParams.get('code');
        if (!code) {
          showError('No se recibió código de autenticación.', 'URL: ' + window.location.href);
          throw new Error('no_code');
        }

        const cfgRes = await fetch('/auth/callback-config.json', { cache: 'no-store' });
        if (!cfgRes.ok) {
          showError('No se pudo cargar la configuración de Supabase.', 'Status: ' + cfgRes.status);
          throw new Error('config_load_failed');
        }
        const cfg = await cfgRes.json();

        // Lesson 2026-06-11 (round 5): with detectSessionInUrl: true, the
        // @supabase/supabase-js@2 client AUTOMATICALLY exchanges the ?code=
        // for a session on init. Calling exchangeCodeForSession(code) again
        // AFTER init throws "PKCE code verifier not found" because the
        // code has already been consumed. We let the auto-handler do it.
        const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.39.0');
        const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
          auth: {
            flowType: 'pkce',
            detectSessionInUrl: true,  // <-- auto-exchange ?code= on init
            persistSession: true,
            autoRefreshToken: true,
            storage: window.localStorage,
            storageKey: 'sb-' + cfg.supabaseUrl.split('//')[1].split('.')[0] + '-auth-token',
          },
        });

        // Wait a tick for auto-exchange to complete, then check the session
        const { data: { session }, error: sessionError } = await supabase.auth.getSession();
        if (sessionError) {
          showError('Error al obtener sesión tras el callback.', sessionError.message);
          throw sessionError;
        }
        if (!session) {
          showError('No se pudo crear la sesión tras el callback.', 'La sesión quedó vacía.');
          throw new Error('no_session');
        }

        statusEl.textContent = '¡Listo! Redirigiendo a la comunidad…';
        spinner.classList.add('hidden');
        setTimeout(() => { window.location.href = '/comunidad'; }, 400);

      } catch (err) {
        if (err && (err.message === 'oauth_error' || err.message === 'no_code' || err.message === 'config_load_failed' || err.message === 'no_session')) {
          // already shown
        } else {
          showError('Error inesperado durante el callback.', err && err.message ? err.message : String(err));
        }
      }
    </script>
  </body>
</html>
