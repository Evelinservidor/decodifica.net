# Decodifica OG image
SVG fallback for when no specific og-image is generated
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#083344;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FF88;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <g transform="translate(100, 200)">
    <text x="0" y="0" font-family="Space Grotesk, sans-serif" font-size="100" font-weight="700" fill="#ffffff">Decodifica</text>
    <text x="0" y="100" font-family="Inter, sans-serif" font-size="36" fill="#a5f3fc">IA en español, sin fluff.</text>
    <text x="0" y="160" font-family="Inter, sans-serif" font-size="24" fill="#9ca3af">decodifica.net</text>
  </g>
</svg>
